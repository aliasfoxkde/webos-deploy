name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - name: Install dependencies
        working-directory: webos
        run: npm ci
      - name: Gates (lint + coverage ratchet)
        working-directory: webos
        run: npm run lint && npm run coverage
      - name: Build
        working-directory: webos
        run: npm run build
      - name: Extract release notes from HISTORY.md
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES=$(grep -m1 "^| v${VERSION} |" docs/planning/HISTORY.md \
            | sed -E 's/^\| v[^|]*\|[^|]*\| //; s/ *\| *$//')
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/release-notes.md
          else
            echo "No HISTORY.md row for v${VERSION}; falling back to generated notes." >&2
            : > /tmp/release-notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webos/dist --project-name artcraft-webos --commit-dirty=true
