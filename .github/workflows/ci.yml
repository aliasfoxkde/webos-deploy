name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webos:
    name: webos — lint, test, coverage gate, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + coverage ratchet
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-dist
          path: webos/dist/
          retention-days: 7
