name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repo (no deploy keys, no
# packages). Deploy runs locally via wrangler, not from CI.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled — the gates take minutes
# and only the latest push's verdict matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webos:
    name: webos — lint, test, coverage gate, contrast audit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      # Standalone so each gate is legible in the job summary; the same
      # suites also run inside the coverage step.
      - name: Docs coverage gate
        run: npx vitest run tests/docs-coverage.test.js

      - name: WCAG contrast audit (personas + tokens + doc references)
        run: npx vitest run tests/contrast-audit.test.js tests/personas-theme.test.js tests/docs-references.test.js tests/glass-tokens.test.js

      - name: Tests + coverage ratchet
        run: npm run coverage

      - name: Build
        run: npm run build

      # Full-system sweep: boots the built dist in headless Chromium and
      # drives every first-party surface. github-latest runners ship Google
      # Chrome; the sweep also accepts /usr/bin/chromium.
      - name: E2E sweep (headless Chromium)
        run: node ../packaging/e2e/webos-sweep.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webos-dist
          path: webos/dist/
          retention-days: 7
