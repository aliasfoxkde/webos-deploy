name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webos:
    name: webos — lint, test, coverage gate, contrast audit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Security scan (Aegis)
        run: ../packaging/aegis-scan.sh

      - name: Shellcheck (packaging scripts)
        run: shellcheck ../packaging/*.sh

      # Standalone so each gate is legible in the job summary.
      - name: Docs coverage gate
        run: npx vitest run tests/docs-coverage.test.js

      - name: WCAG contrast audit (personas + tokens + doc references)
        run: npx vitest run tests/contrast-audit.test.js tests/personas-theme.test.js tests/docs-references.test.js tests/glass-tokens.test.js

      - name: Tests + coverage ratchet
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: E2E sweep (headless Chrome)
        run: node ../packaging/e2e/webos-sweep.mjs
        env:
          CHROME: /usr/bin/google-chrome

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webos-dist
          path: webos/dist/
          retention-days: 7
