name: Question
description: Ask how something works or how to use it
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What the docs say / what you tried
      description: Which docs pages did you check? (Start at docs/README.md.)
