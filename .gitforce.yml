# GitForge CI pipeline (https://github.com/aliasfoxkde/GitForge) — local
# mirror of .github/workflows/ci.yml.
#
# ONE job, ordered steps: GitForge's deployed trigger path queues only the
# first job with empty `needs` and never schedules dependents, so a
# needs-based lane split silently degrades to "first job only". Steps are
# ordered so a failure fails the job immediately.
#
# The coverage step enforces the ratchet in webos/vitest.config.js and runs
# the whole suite — including the WCAG contrast auditor
# (tests/contrast-audit.test.js) and the persona/theme gate
# (tests/personas-theme.test.js tests/docs-references.test.js tests/glass-tokens.test.js).
#
# node:24 — matches the version the suite is validated against locally
# (v24.x); happy-dom 20 + vitest 5 are happy there.
name: webos-deploy-ci
version: "1"
trigger_on: [push]
environment:
  CI: "true"
jobs:
  - name: gates
    image: node:24-trixie-slim
    needs: []
    timeout: "30m"
    retry: 0
    steps:
      - name: install
        run: cd webos && npm ci
      - name: lint
        run: cd webos && node node_modules/.bin/eslint . --max-warnings 0
      - name: docs coverage gate
        run: cd webos && npx vitest run tests/docs-coverage.test.js
      - name: wcag contrast audit
        run: cd webos && npx vitest run tests/contrast-audit.test.js tests/personas-theme.test.js tests/docs-references.test.js tests/glass-tokens.test.js
      - name: tests + coverage ratchet
        run: cd webos && npm run coverage
      - name: build
        run: cd webos && npm run build
      # The e2e sweep needs a headless browser. This GitForge image ships
      # none, and installing one via apt needs root — so the browser is
      # fetched instead as a self-contained Chrome headless shell, which
      # needs no privileges. The sweep is therefore a hard gate here too,
      # exactly as it is on GitHub Actions (where the runner image already
      # ships Google Chrome).
      - name: install headless browser
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/webos-browsers"
      - name: e2e sweep
        run: |
          CHROME="$(find "$HOME/.cache/webos-browsers" -type f -name 'chrome-headless-shell' -print -quit)"
          if [ -z "$CHROME" ]; then echo "no headless browser found"; exit 1; fi
          echo "sweep browser: $CHROME"
          CHROME="$CHROME" node packaging/e2e/webos-sweep.mjs
